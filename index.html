<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Denní plán</title>
<meta name="theme-color" content="#0e5a78">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Plán">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: nahoře další krok, pod ním všechny čtyři sekce důležitosti najednou (2x2, na telefonu pod sebou). */
:root{
  --bg:#f1f4f6; --surface:#ffffff; --ink:#13202a; --muted:#5b6b78; --line:#d9e0e5;
  --accent:#0e5a78; --accent-ink:#ffffff;
  --t1:#c0392b; --t2:#b7791f; --t3:#4f7a91; --t4:#7d8891;
  --ok:#2f7d4f;
  --font-display:'Archivo','Arial Narrow',system-ui,sans-serif;
  --font-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f171d; --surface:#17222a; --ink:#e7edf1; --muted:#94a5b1; --line:#2a3944;
    --accent:#6fc0e0; --accent-ink:#0b1a22;
    --t1:#ef7a6c; --t2:#e0aa4f; --t3:#7fb2cb; --t4:#8f9aa4; --ok:#6cc08b;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.45;
  padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.wrap{max-width:1120px;margin:0 auto;padding:20px 16px 56px;display:flex;flex-direction:column;gap:16px}
header.top{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px}
h1{font-family:var(--font-display);font-weight:800;font-size:28px;letter-spacing:-.01em;margin:0}
.date{color:var(--muted);font-size:15px;text-transform:capitalize}
h2{font-family:var(--font-display);font-weight:700;font-size:18px;margin:0;text-wrap:balance}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.now{border:2px solid var(--accent);display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.now .lbl{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);width:100%;margin:0}
.now .txt{flex:1;min-width:200px;font-family:var(--font-display);font-weight:700;font-size:20px;line-height:1.25;text-wrap:balance}
.boards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
@media (max-width:820px){.boards{grid-template-columns:1fr}}
.sec{border-top:6px solid var(--c)}
.sec header{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:2px}
.sec .sub{font-size:13px;color:var(--muted);margin:0 0 10px}
.count{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:500;font-size:14px;white-space:nowrap}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.task{display:flex;align-items:flex-start;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.task .body{flex:1;min-width:0}
.task .txt{overflow-wrap:anywhere}
.task.done .txt{text-decoration:line-through;color:var(--muted)}
.task .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;align-items:center}
button{font:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 12px;font-weight:500;min-height:40px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.small{min-height:34px;padding:4px 10px;font-size:14px}
.btn.ghost{background:transparent;color:var(--muted)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.check{width:26px;height:26px;border-radius:6px;border:2px solid var(--muted);background:transparent;color:var(--accent-ink);display:grid;place-items:center;padding:0;flex-shrink:0;margin-top:1px}
.check[aria-checked="true"]{background:var(--ok);border-color:var(--ok)}
.empty{padding:12px;border:1px dashed var(--line);border-radius:8px;color:var(--muted);font-size:14px}
form.add{display:grid;grid-template-columns:1fr auto auto;gap:8px}
@media (max-width:560px){form.add{grid-template-columns:1fr}}
input[type=text],select{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:40px;width:100%}
select.mini{width:auto;min-height:30px;padding:2px 6px;font-size:13px}
.note{font-size:13px;color:var(--muted);margin:8px 0 0}
.foot{display:flex;flex-wrap:wrap;gap:8px}
.r{display:flex;align-items:center;gap:10px;padding:6px 2px}
.r .txt{flex:1}
.r.done .txt{text-decoration:line-through;color:var(--muted)}
form.radd{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:8px}
@media (prefers-reduced-motion:no-preference){.btn,.check{transition:background .15s,border-color .15s}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Denní plán</h1>
    <div class="date" id="date"></div>
  </header>

  <section class="card now" id="now" aria-label="Další krok"></section>

  <section class="card" aria-labelledby="addh">
    <h2 id="addh" style="margin-bottom:10px">Přidat úkol</h2>
    <form class="add" id="add" autocomplete="off">
      <input type="text" id="text" aria-label="Text úkolu" placeholder="Co je potřeba udělat?">
      <select id="area" aria-label="Oblast"></select>
      <button class="btn primary" type="submit">Přidat</button>
    </form>
    <p class="note">Úkoly se ukládají jen v tomto zařízení a prohlížeči.</p>
  </section>

  <div class="boards" id="boards"></div>

  <section class="card" aria-labelledby="rh">
    <h2 id="rh" style="margin-bottom:8px">Denní rutiny</h2>
    <div id="rut"></div>
    <form class="radd" id="radd" autocomplete="off">
      <input type="text" id="rtext" aria-label="Nová rutina" placeholder="Nová rutina (každý den)">
      <button class="btn" type="submit">Přidat</button>
    </form>
  </section>

  <div class="foot">
    <button class="btn small ghost" data-act="cleardone" type="button">Smazat hotové</button>
  </div>
  <p class="note" id="storenote"></p>
</div>

<script>
const AREAS=[
  {id:'skola',name:'Škola',tier:1},
  {id:'trenovani',name:'Trénování',tier:1},
  {id:'jidelnicek',name:'Jídelníček',tier:1},
  {id:'tennisscout',name:'TennisScout',tier:2},
  {id:'omtc',name:'OMTennisCoaches',tier:2},
  {id:'aividea',name:'AI videa',tier:3},
  {id:'ostatni',name:'Ostatní',tier:4}
];
const TIERS={
  1:{name:'Nejdůležitější',sub:'Škola, Trénování, Jídelníček'},
  2:{name:'Důležité',sub:'TennisScout, OMTennisCoaches'},
  3:{name:'Méně důležité',sub:'AI videa'},
  4:{name:'Nedůležité, ale musím',sub:'Vše ostatní'}
};
const TCOL={1:'var(--t1)',2:'var(--t2)',3:'var(--t3)',4:'var(--t4)'};
const KEY='denni-plan-v1';

function todayStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function uid(){return 'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function areaOf(id){return AREAS.find(a=>a.id===id)||AREAS[AREAS.length-1];}
function aIdx(id){const i=AREAS.findIndex(a=>a.id===id);return i<0?AREAS.length:i;}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function load(){
  try{
    const raw=localStorage.getItem(KEY);
    if(raw){
      const d=JSON.parse(raw);
      if(d&&Array.isArray(d.tasks)){
        d.rutiny=Array.isArray(d.rutiny)?d.rutiny:[];
        if(d.date!==todayStr()){d.tasks=d.tasks.filter(t=>!t.done);d.date=todayStr();}
        return d;
      }
    }
  }catch(e){ noStore(); }
  return {date:todayStr(),tasks:[],rutiny:[]};
}
function noStore(){document.getElementById('storenote').textContent='Prohlížeč nedovoluje ukládání. Úkoly zůstanou jen do zavření stránky.';}
function save(){
  try{ localStorage.setItem(KEY,JSON.stringify(state)); }catch(e){ noStore(); }
}

let state=load();

function openTasks(){return state.tasks.filter(t=>!t.done);}
function sorted(list){return list.slice().sort((a,b)=>aIdx(a.area)-aIdx(b.area));}
function nextTask(){
  for(let tier=1;tier<=4;tier++){
    const c=sorted(openTasks().filter(t=>areaOf(t.area).tier===tier));
    if(c.length) return c[0];
  }
  return null;
}

function checkBtn(act,id,on,label){
  return '<button class="check" type="button" role="checkbox" aria-checked="'+(on?'true':'false')+'" aria-label="'+esc(label)+'" data-act="'+act+'" data-id="'+id+'">'+
    (on?'<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3.2 3.2L13 4.8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>':'')+'</button>';
}

function renderNow(){
  const t=nextTask(), el=document.getElementById('now');
  if(!t){
    el.innerHTML='<p class="lbl">Další krok</p><div class="txt">'+(state.tasks.length?'Všechno hotovo.':'Zatím žádné úkoly. Přidej je níže.')+'</div>';
    return;
  }
  el.innerHTML='<p class="lbl">Další krok</p><div class="txt">'+esc(t.text)+'</div>'+
    '<button class="btn primary" type="button" data-act="toggle" data-id="'+t.id+'">Hotovo</button>';
}

function renderBoards(){
  let h='';
  [1,2,3,4].forEach(tier=>{
    const items=sorted(state.tasks.filter(t=>areaOf(t.area).tier===tier));
    const open=items.filter(t=>!t.done), done=items.filter(t=>t.done);
    h+='<section class="card sec" style="--c:'+TCOL[tier]+'" aria-label="'+esc(TIERS[tier].name)+'">'+
      '<header><h2>'+esc(TIERS[tier].name)+'</h2><span class="count">'+open.length+' otevřeno'+(done.length?' · '+done.length+' hotovo':'')+'</span></header>'+
      '<p class="sub">'+esc(TIERS[tier].sub)+'</p>';
    if(!items.length){h+='<div class="empty">Zatím prázdné.</div>';}
    else{
      h+='<ul class="list">';
      open.concat(done).forEach(t=>{
        const opts=AREAS.map(a=>'<option value="'+a.id+'"'+(a.id===t.area?' selected':'')+'>'+esc(a.name)+'</option>').join('');
        h+='<li class="task'+(t.done?' done':'')+'">'+
          checkBtn('toggle',t.id,t.done,'Hotovo: '+t.text)+
          '<div class="body"><div class="txt">'+esc(t.text)+'</div><div class="meta">'+
          '<select class="mini" data-change="area" data-id="'+t.id+'" aria-label="Oblast úkolu">'+opts+'</select></div></div>'+
          '<button class="btn small ghost" type="button" data-act="del" data-id="'+t.id+'" aria-label="Smazat úkol">Smazat</button></li>';
      });
      h+='</ul>';
    }
    h+='</section>';
  });
  document.getElementById('boards').innerHTML=h;
}

function renderRut(){
  const td=todayStr();
  document.getElementById('rut').innerHTML=state.rutiny.length?state.rutiny.map(r=>{
    const on=r.doneDate===td;
    return '<div class="r'+(on?' done':'')+'">'+checkBtn('rtoggle',r.id,on,'Hotovo: '+r.text)+
      '<span class="txt">'+esc(r.text)+'</span>'+
      '<button class="btn small ghost" type="button" data-act="rdel" data-id="'+r.id+'" aria-label="Smazat rutinu">Smazat</button></div>';
  }).join(''):'<p class="note">Žádné rutiny. Přidej něco, co děláš každý den.</p>';
}

function render(){
  document.getElementById('date').textContent=new Date().toLocaleDateString('cs-CZ',{weekday:'long',day:'numeric',month:'long'});
  renderNow();renderBoards();renderRut();
}
function commit(){render();save();}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  const act=b.dataset.act, id=b.dataset.id;
  const t=state.tasks.find(x=>x.id===id);
  if(act==='toggle'&&t){t.done=!t.done;commit();}
  else if(act==='del'){state.tasks=state.tasks.filter(x=>x.id!==id);commit();}
  else if(act==='rtoggle'){const r=state.rutiny.find(x=>x.id===id);if(r){r.doneDate=(r.doneDate===todayStr())?'':todayStr();commit();}}
  else if(act==='rdel'){state.rutiny=state.rutiny.filter(x=>x.id!==id);commit();}
  else if(act==='cleardone'){state.tasks=state.tasks.filter(x=>!x.done);commit();}
});
document.addEventListener('change',e=>{
  const s=e.target.closest('[data-change="area"]'); if(!s) return;
  const t=state.tasks.find(x=>x.id===s.dataset.id);
  if(t){t.area=s.value;commit();}
});

document.getElementById('add').addEventListener('submit',e=>{
  e.preventDefault();
  const inp=document.getElementById('text'), v=inp.value.trim();
  if(!v){inp.focus();return;}
  state.tasks.push({id:uid(),area:document.getElementById('area').value,text:v,done:false});
  inp.value='';inp.focus();commit();
});
document.getElementById('radd').addEventListener('submit',e=>{
  e.preventDefault();
  const inp=document.getElementById('rtext'), v=inp.value.trim();
  if(!v){inp.focus();return;}
  state.rutiny.push({id:uid(),text:v,doneDate:''});
  inp.value='';commit();
});

/* Více otevřených oken: změna v jednom se projeví v druhém. */
window.addEventListener('storage',e=>{
  if(e.key===KEY){state=load();render();}
});
/* Po návratu do appky přes noc se seznam přepočítá na nový den. */
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden){state=load();render();}
});

document.getElementById('area').innerHTML=AREAS.map(a=>'<option value="'+a.id+'">'+esc(a.name)+'</option>').join('');
render();
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
</script>
</body>
</html>
